name: Bug 报告
description: 报告可复现的功能、数据或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请勿公开提交，请阅读 SECURITY.md。不要上传 Cookie、数据库或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: YAM 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、稳定的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与影响
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏诊断信息
      description: 可提供错误码或日志片段，但必须移除路径中的个人信息、Cookie、token 和 session。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认未附加 Cookie、数据库、凭证或未脱敏日志。
          required: true
